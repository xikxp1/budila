name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Validate bundled resources
        run: |
          file Budila/Resources/alarm.caf | grep -q 'CoreAudio Format'
          afinfo Budila/Resources/alarm.caf | grep -q 'estimated duration: 29.000'
          sips -g pixelWidth -g pixelHeight -g hasAlpha Budila/Assets.xcassets/AppIcon.appiconset/AppIcon.png | grep -q 'pixelWidth: 1024'
          sips -g pixelWidth -g pixelHeight -g hasAlpha Budila/Assets.xcassets/AppIcon.appiconset/AppIcon.png | grep -q 'pixelHeight: 1024'
          sips -g hasAlpha Budila/Assets.xcassets/AppIcon.appiconset/AppIcon.png | grep -q 'hasAlpha: no'
      - name: Test
        run: >-
          xcodebuild test
          -project Budila.xcodeproj
          -scheme Budila
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16e,OS=26.2'
          CODE_SIGNING_ALLOWED=NO

  testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Install App Store Connect API key
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild archive \
            -project Budila.xcodeproj \
            -scheme Budila \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Budila.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export signed IPA
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_OPTIONS"
          plutil -insert method -string app-store-connect "$EXPORT_OPTIONS"
          plutil -insert destination -string export "$EXPORT_OPTIONS"
          plutil -insert signingStyle -string automatic "$EXPORT_OPTIONS"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Budila.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/Budila.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          wait-for-processing: "true"
          backend: appstore-api
